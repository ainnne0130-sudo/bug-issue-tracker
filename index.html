<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug / Issue Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">
                <i class="fa-solid fa-bug"></i>
                Bug / Issue Tracker
            </h1>
            <p class="text-muted">
                Create, manage and track your issues easily.
            </p>
        </div>

        <!-- Dashboard -->
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="dashboard-card">
                    <i class="fa-solid fa-folder-open"></i>
                    <h5>Open</h5>
                    <h2 id="openCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="dashboard-card">
                    <i class="fa-solid fa-spinner"></i>
                    <h5>In Progress</h5>
                    <h2 id="progressCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="dashboard-card">
                    <i class="fa-solid fa-circle-check"></i>
                    <h5>Closed</h5>
                    <h2 id="closedCount">0</h2>
                </div>
            </div>

        </div>

        <!-- Create Issue -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <h3 class="mb-3">
                    <i class="fa-solid fa-plus"></i>
                    Create Issue
                </h3>

                <form id="issueForm">

                    <div class="mb-3">
                        <label for="title" class="form-label">
                            Title
                        </label>
                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            placeholder="Enter issue title"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description
                        </label>
                        <textarea
                            id="description"
                            class="form-control"
                            rows="3"
                            placeholder="Describe the issue"
                            required
                        ></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="priority" class="form-label">
                                Priority
                            </label>

                            <select id="priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">
                                Status
                            </label>

                            <select id="status" class="form-select">
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i>
                        Add Issue
                    </button>

                </form>

            </div>
        </div>

        <!-- Filter & Search -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="filterStatus" class="form-label">
                            Filter by Status
                        </label>

                        <select id="filterStatus" class="form-select">
                            <option value="All">All Issues</option>
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="searchInput" class="form-label">
                            Search
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search by title..."
                        >
                    </div>

                </div>

            </div>
        </div>

        <!-- Issue List -->
        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0">
                        <i class="fa-solid fa-list"></i>
                        Issue List
                    </h3>

                    <span class="badge bg-secondary" id="issueCount">
                        0 Issues
                    </span>
                </div>

                <div id="issueList"></div>

                <div id="emptyMessage" class="text-center text-muted py-4">
                    <i class="fa-solid fa-inbox fa-2x mb-2"></i>
                    <p class="mb-0">No issues found.</p>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
